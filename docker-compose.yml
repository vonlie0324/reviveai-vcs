services:
  backend:
    build:
      context: ./backend
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      CORS_ORIGINS: http://localhost:5173
      APP_ENV: development
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      CONTENT_DNA_BATCH_SIZE: ${CONTENT_DNA_BATCH_SIZE:-6}
      CONTENT_DNA_MAX_VIDEOS: ${CONTENT_DNA_MAX_VIDEOS:-0}
      IMAGE_GENERATION_MODEL: ${IMAGE_GENERATION_MODEL:-gemini-2.5-flash-image}
      MEDIA_IMAGE_ASPECT_RATIO: ${MEDIA_IMAGE_ASPECT_RATIO:-9:16}
      VIDEO_GENERATION_MODEL: ${VIDEO_GENERATION_MODEL:-veo-3.1-generate-001}
      VIDEO_GENERATION_LOCATION: ${VIDEO_GENERATION_LOCATION:-us-central1}
      VIDEO_OUTPUT_GCS_URI: ${VIDEO_OUTPUT_GCS_URI:-}
      VIDEO_GENERATION_RESOLUTION: ${VIDEO_GENERATION_RESOLUTION:-720p}
      VIDEO_GENERATION_AUDIO: ${VIDEO_GENERATION_AUDIO:-false}
      AUDIO_TRENDING_MUSIC_CATALOG_PATH: ${AUDIO_TRENDING_MUSIC_CATALOG_PATH:-music_library/trending_music_catalog.json}
      AUDIO_TRENDING_MUSIC_LIBRARY_DIR: ${AUDIO_TRENDING_MUSIC_LIBRARY_DIR:-music_library}
      AUDIO_YOUTUBE_LIBRARY_CATALOG_PATH: ${AUDIO_YOUTUBE_LIBRARY_CATALOG_PATH:-music_library/youtube_audio_library_catalog.json}
      AUDIO_YOUTUBE_LIBRARY_DIR: ${AUDIO_YOUTUBE_LIBRARY_DIR:-music_library/youtube_audio_library}
      AUDIO_YOUTUBE_LIBRARY_MAX_UPLOAD_MB: ${AUDIO_YOUTUBE_LIBRARY_MAX_UPLOAD_MB:-50}
      DELIVERY_QC_DURATION_TOLERANCE_SECONDS: ${DELIVERY_QC_DURATION_TOLERANCE_SECONDS:-0.35}
      DELIVERY_QC_LOUDNESS_TOLERANCE_LUFS: ${DELIVERY_QC_LOUDNESS_TOLERANCE_LUFS:-2.0}
      DELIVERY_QC_MAX_TRUE_PEAK_DBFS: ${DELIVERY_QC_MAX_TRUE_PEAK_DBFS:--1.0}
      DELIVERY_QC_MAX_UNEXPECTED_SILENCE_SECONDS: ${DELIVERY_QC_MAX_UNEXPECTED_SILENCE_SECONDS:-2.5}
      FIREBASE_AUTH_REQUIRED: ${FIREBASE_AUTH_REQUIRED:-true}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SESSION_COOKIE_NAME: ${FIREBASE_SESSION_COOKIE_NAME:-reviveai_session}
      FIREBASE_CSRF_COOKIE_NAME: ${FIREBASE_CSRF_COOKIE_NAME:-reviveai_csrf}
      FIREBASE_SESSION_DAYS: ${FIREBASE_SESSION_DAYS:-5}
      FIREBASE_COOKIE_SECURE: ${FIREBASE_COOKIE_SECURE:-false}
      FIREBASE_COOKIE_SAMESITE: ${FIREBASE_COOKIE_SAMESITE:-lax}
      FIREBASE_CHECK_REVOKED: ${FIREBASE_CHECK_REVOKED:-false}
    volumes:
      # M2C.2.5 stores creator-downloaded YouTube Audio Library files here, so this
      # bind mount must be writable. Runtime audio files are ignored by Git.
      - ./backend/music_library:/app/music_library
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:8080
      VITE_CSRF_COOKIE_NAME: ${VITE_CSRF_COOKIE_NAME:-reviveai_csrf}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend
